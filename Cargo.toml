[package]
name = "ravenvoice"
version = "0.1.0"
edition = "2024"
description = "Offline dictation (speech-to-text) and text-to-speech overlay for Raven Linux"
license = "MIT"

[features]
default = ["layer-shell"]
# Float the overlay above every window without ever taking keyboard focus
# (zwlr_layer_shell_v1). Needs the system gtk4-layer-shell library.
layer-shell = ["dep:gtk4-layer-shell"]
# GPU-accelerated Whisper through Vulkan. Needs vulkan-headers and shaderc.
vulkan = ["whisper-rs/vulkan"]

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
clap = { version = "4.6.7", features = ["derive"] }
cpal = { version = "0.18.2", features = ["pulseaudio"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
env_logger = "0.11.11"
evdev = "0.13.2"
gtk4 = { version = "0.11.5", features = ["v4_14"] }
gtk4-layer-shell = { version = "0.8.1", optional = true }
hound = "3.5.1"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
ureq = "3.4.2"
whisper-rs = { version = "0.16.0", features = ["log_backend"] }

[profile.release]
lto = "thin"
codegen-units = 4

# whisper.cpp is unbearably slow without optimisation, even in debug builds.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
