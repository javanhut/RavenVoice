[env]
# whisper-rs-sys ships pre-generated bindings; skip bindgen so libclang is not required.
WHISPER_DONT_GENERATE_BINDINGS = "1"
# /usr/sbin comes before /usr/bin in the Raven PATH and is a symlink to it, but
# cmake invoked as /usr/sbin/cmake cannot find its modules ("Could not find
# CMAKE_ROOT"). Name the real path for whisper.cpp's build.
CMAKE = "/usr/bin/cmake"

# Build Raven Glass from the RavenGUI checkout beside this one rather than the
# copy on GitHub, so a change to the shared look is tried here before it is
# pushed. The image build checks every app out beside RavenGUI, so it takes
# this path too. Delete this file to use the git dependency as it is.
[patch."https://github.com/javanhut/RavenGUI.git"]
raven-glass = { path = "../RavenGUI/crates/raven-glass" }
